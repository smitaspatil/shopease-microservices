spring:
  application:
    name: order-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

      httpclient:
        hc5:
          enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: root

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      UserClientfindById:
        registerHealthIndicator: true
      ProductClientfindById:
        registerHealthIndicator: true
      ProductClientupdateStock:
        registerHealthIndicator: true